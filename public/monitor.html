<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTI 监控后台</title>
<style>
:root{color-scheme:dark;--bg:#08090f;--panel:#12141f;--panel2:#191b29;--text:#ebeaf3;--sub:#9a9aae;--line:rgba(255,255,255,.08);--red:#c24355;--purple:#9850c8;--gold:#c2a058;--green:#4aa882}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;line-height:1.55}.shell{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.title h1{font-size:26px;margin:0 0 4px}.title p{margin:0;color:var(--sub);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--red)}.danger{color:#ffd8de;border-color:rgba(194,67,85,.35)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.stat b{display:block;font-size:22px}.stat span{color:var(--sub);font-size:12px}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px}.list,.detail,.login{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:560px;overflow:hidden}.list-head{padding:12px;border-bottom:1px solid var(--line)}input{width:100%;border:1px solid var(--line);background:#0d0e16;color:var(--text);border-radius:8px;padding:10px}.records{max-height:640px;overflow:auto}.record{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-align:left;padding:12px;display:block}.record.active{background:rgba(152,80,200,.13)}.record .code{color:var(--gold);font-weight:800;letter-spacing:1px}.record .meta{color:var(--sub);font-size:12px;margin-top:3px}.detail{padding:18px;overflow:auto}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub)}.badge{display:inline-flex;padding:4px 10px;border-radius:999px;background:rgba(194,67,85,.14);color:#ffb7c2;font-size:12px;margin:0 6px 6px 0}.scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}.score{background:var(--panel2);border-radius:8px;padding:10px}.score small{color:var(--sub);display:block}.bar{height:6px;background:#0d0e16;border-radius:999px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--purple),var(--gold))}.answers{border-collapse:collapse;width:100%;font-size:13px;margin-top:14px}.answers th,.answers td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.answers th{color:var(--sub);font-weight:500}.answers td:first-child{color:var(--sub);width:52px}.notice{color:var(--sub);font-size:12px;margin-top:12px}.login{max-width:420px;min-height:0;margin:64px auto;padding:22px}.login h2{margin:0 0 10px}.login p{color:var(--sub);font-size:13px}.login button{width:100%;margin-top:10px}.hidden{display:none}@media(max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.scores{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<section class="login" id="login">
  <h2>监控后台登录</h2>
  <p>输入 Vercel 环境变量 <code>MONITOR_PASSWORD</code> 设置的后台密码。</p>
  <input id="password" type="password" placeholder="后台密码" autocomplete="current-password">
  <button id="login-btn">进入后台</button>
  <p id="login-error" style="color:#ffb7c2"></p>
</section>

<main class="shell hidden" id="app">
  <div class="top">
    <div class="title">
      <h1>ASTI 监控后台</h1>
      <p>本页显示云端收到的答题记录。应用页：<a href="/" style="color:var(--gold)">/</a></p>
    </div>
    <div class="actions">
      <button id="refresh">刷新</button>
      <button id="logout">退出</button>
      <button class="danger" id="clear">清空记录</button>
    </div>
  </div>
  <section class="stats">
    <div class="stat"><b id="total">0</b><span>总记录</span></div>
    <div class="stat"><b id="today">0</b><span>今日记录</span></div>
    <div class="stat"><b id="latest">-</b><span>最近类型</span></div>
    <div class="stat"><b id="updated">-</b><span>最后更新</span></div>
  </section>
  <section class="grid">
    <aside class="list">
      <div class="list-head"><input id="search" placeholder="搜索类型、题目、答案"></div>
      <div class="records" id="records"></div>
    </aside>
    <section class="detail" id="detail"><div class="empty">暂无记录</div></section>
  </section>
</main>

<script>
const dimNames = {D:'支配倾向',O:'开放程度',K:'猎奇指数',R:'浪漫需求',L:'欲望强度',E:'表现欲望',F:'幻想倾向',A:'情感依恋',G:'性别弹性',T:'道具兴趣'};
let records = [];
let selectedId = null;
let password = sessionStorage.getItem('monitorPassword') || '';

const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = iso => iso ? new Date(iso).toLocaleString() : '-';

async function authedFetch(url, options = {}){
  return fetch(url, {
    ...options,
    headers: {
      ...(options.headers || {}),
      Authorization: `Bearer ${password}`
    },
    cache: 'no-store'
  });
}

async function loadRecords(){
  const res = await authedFetch('/api/records');
  if(res.status === 401){
    sessionStorage.removeItem('monitorPassword');
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-error').textContent = '密码错误或未配置后台密码。';
    return;
  }
  const data = await res.json();
  records = data.records || [];
  if(!selectedId && records[0]) selectedId = records[0].id;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  render();
}

function filteredRecords(){
  const q = $('search').value.trim().toLowerCase();
  if(!q) return records;
  return records.filter(r => JSON.stringify(r).toLowerCase().includes(q));
}

function renderStats(){
  const todayKey = new Date().toDateString();
  $('total').textContent = records.length;
  $('today').textContent = records.filter(r => new Date(r.createdAt).toDateString() === todayKey).length;
  $('latest').textContent = records[0]?.result?.code || '-';
  $('updated').textContent = new Date().toLocaleTimeString();
}

function renderList(list){
  $('records').innerHTML = list.map(r => `
    <button class="record ${r.id === selectedId ? 'active' : ''}" data-id="${esc(r.id)}">
      <div><span class="code">${esc(r.result?.code || '-')}</span> ${esc(r.result?.cn || '')}</div>
      <div class="meta">${esc(fmt(r.createdAt))} · ${esc(r.analysis?.roleLabel || '-')} · ${esc(r.analysis?.orientBrief || '-')}</div>
    </button>
  `).join('') || '<div class="empty" style="min-height:220px">没有匹配记录</div>';
}

function renderDetail(){
  const r = records.find(item => item.id === selectedId);
  if(!r){
    $('detail').innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }

  const scores = Object.entries(r.scores || {}).map(([key, value]) => `
    <div class="score">
      <small>${esc(dimNames[key] || key)}</small>
      <strong>${esc(value)}</strong>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, Number(value) || 0))}%"></i></div>
    </div>
  `).join('');

  const answers = (r.questions || []).map(q => `
    <tr>
      <td>${esc(q.order)}</td>
      <td>${esc(q.text)}</td>
      <td>${esc(q.answerLabel)} <span style="color:var(--sub)">(${esc(q.answer)})</span></td>
    </tr>
  `).join('');

  $('detail').innerHTML = `
    <h2 style="margin:0 0 4px">${esc(r.result?.code || '-')} · ${esc(r.result?.cn || '')} <span style="color:var(--sub);font-size:16px">${esc(r.result?.en || '')}</span></h2>
    <p style="margin:0 0 10px;color:var(--gold)">${esc(r.result?.slogan || '')}</p>
    <span class="badge">${esc(r.analysis?.roleLabel || '-')} / 攻度 ${esc(r.analysis?.atkPct ?? '-')}%</span>
    <span class="badge">${esc(r.analysis?.orientBrief || '-')}</span>
    <span class="badge">${esc(r.analysis?.kinkLvBrief || '-')}</span>
    ${(r.analysis?.kinkSubs || []).map(x => `<span class="badge">${esc(x)}</span>`).join('')}
    <p style="color:var(--sub);font-size:13px">提交时间：${esc(fmt(r.createdAt))} · IP：${esc(r.ip || '-')}</p>
    <p style="color:var(--sub)">${esc(r.result?.desc || '')}</p>
    <div class="scores">${scores}</div>
    <h3>答题明细</h3>
    <table class="answers">
      <thead><tr><th>#</th><th>题目</th><th>回答</th></tr></thead>
      <tbody>${answers}</tbody>
    </table>
    <p class="notice">云端记录保存在 Upstash Redis 列表 <code>asti:records</code>。</p>
  `;
}

function render(){
  const list = filteredRecords();
  renderStats();
  renderList(list);
  if(!records.some(r => r.id === selectedId) && records[0]) selectedId = records[0].id;
  renderDetail();
}

$('login-btn').addEventListener('click', async () => {
  password = $('password').value;
  sessionStorage.setItem('monitorPassword', password);
  await loadRecords();
});
$('password').addEventListener('keydown', event => {
  if(event.key === 'Enter') $('login-btn').click();
});
$('records').addEventListener('click', event => {
  const button = event.target.closest('.record');
  if(!button) return;
  selectedId = button.dataset.id;
  render();
});
$('search').addEventListener('input', render);
$('refresh').addEventListener('click', loadRecords);
$('logout').addEventListener('click', () => {
  password = '';
  sessionStorage.removeItem('monitorPassword');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
});
$('clear').addEventListener('click', async () => {
  if(!confirm('确定清空所有答题记录？')) return;
  await authedFetch('/api/records', { method:'DELETE' });
  selectedId = null;
  await loadRecords();
});

if(password) loadRecords();
</script>
</body>
</html>
